name = "crash-where-collector"
main = "src/index.ts"
# The newest date the test runtime in @cloudflare/vitest-pool-workers accepts;
# raise it when that package catches up.
compatibility_date = "2026-08-22"
# Deploys leave values set in the Workers dashboard in place, so the Access
# values survive whether they were entered as secrets or as plain vars.
keep_vars = true

# The index of apps and crash metadata. No database_id: `wrangler deploy`
# provisions the database on first use, and the Deploy button writes the id
# of the one it created. Migrations live in migrations/ and are applied by
# `npm run deploy` and `npm run dev`.
[[d1_databases]]
binding = "DB"
database_name = "crash-where"
migrations_dir = "migrations/root"

# One Durable Object per app holds that app's crash index in SQLite storage,
# with its schema from migrations/shard applied by the object itself.
[[durable_objects.bindings]]
name = "SHARD"
class_name = "AppShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppShard"]

# Lets the Worker import the shard migrations and the stylesheet as text.
[[rules]]
type = "Text"
globs = ["**/*.sql", "**/*.css"]
fallthrough = true

# Symbol tables uploaded by CI, one immutable object per build under
# symbols/<app>/<build_id>.cwsym.
[[r2_buckets]]
binding = "SYMBOLS"
bucket_name = "crash-where-symbols"
