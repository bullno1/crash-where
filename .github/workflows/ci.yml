name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.toolchain }} (Linux)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang-mold]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # gdb and elfutils open the core a crash test leaves; the test
        # script skips that check when they are missing, so they are named
        # here to make sure it runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libdw-dev libcurl4-openssl-dev gdb elfutils
      - name: Install mold
        if: matrix.toolchain == 'clang-mold'
        uses: rui314/setup-mold@v1
        with:
          # The toolchain file selects mold itself; keep the system linker
          # untouched.
          make-default: false
      - name: Build and test
        run: cmd/${{ matrix.toolchain }}/test
      - name: Keep the symbol tool and the sample game for the end-to-end job
        if: matrix.toolchain == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: cwsym-gcc
          # The sample's debug file travels with it: the tool reads the
          # symbols through its debug link.
          path: |
            bin/gcc/RelWithDebInfo/cwsym
            bin/gcc/RelWithDebInfo/crashme
            bin/gcc/RelWithDebInfo/crashme.debug
          if-no-files-found: error
          # Only the e2e job of this run reads it; one day is the minimum.
          retention-days: 1

  steamrt:
    name: clang-mold (Steam Runtime 4)
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:latest
    steps:
      - uses: actions/checkout@v4
      # The SDK ships gdb, which checks the core a crash test leaves, and
      # the test script skips eu-stack as not installed. Installing
      # elfutils here would only make that check fail: the SDK's mold
      # (2.37) writes a separate debug file without program headers, and
      # elfutils cannot map an address into it.
      - name: Build and test
        run: cmd/steamrt/test

  web:
    name: ${{ matrix.toolchain }} (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: emscripten
            browser: chromium
            os: ubuntu-24.04
          - toolchain: emscripten
            browser: firefox
            os: ubuntu-24.04
          - toolchain: emscripten
            browser: safari
            # Safari 27 is the first with JavaScript Promise Integration,
            # which the test runner needs. The macOS 26 images carry Safari
            # 26; this preview image, macOS 27, carries 27.
            os: xcode-27
          # The build with threads, which a game using pthreads gets.
          - toolchain: emscripten-pthread
            browser: chromium
            os: ubuntu-24.04
          - toolchain: emscripten-pthread
            browser: firefox
            os: ubuntu-24.04
          - toolchain: emscripten-pthread
            browser: safari
            os: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.10
      - name: Allow remote automation of Safari
        if: matrix.browser == 'safari'
        # Safari has no headless mode; the launcher drives it through
        # safaridriver, which Safari must have been told once to accept.
        run: sudo safaridriver --enable
      - name: Build and test
        env:
          # Named, so that a missing browser fails the job. Left unset, the
          # script runs whichever browsers it finds.
          CW_TEST_BROWSERS: ${{ matrix.browser }}
        run: cmd/${{ matrix.toolchain }}/test

  msvc:
    name: msvc (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: cmd\msvc\test.bat

  collector:
    name: collector (check and test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      # Type check, lint, and verify that the generated database types
      # match the migrations; the last step applies them to a local D1.
      - run: npm run check
      - run: npm test

  e2e:
    name: upload and report (end to end)
    runs-on: ubuntu-24.04
    # Runs only once both halves passed on their own, so a failure here is
    # the seam between them. `linux` is the matrix job, so this waits for
    # clang-mold as well as gcc; the binary comes from gcc.
    needs: [linux, collector]
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
        working-directory: collector
      - name: Install the symbol tool's libraries
        # The tool links libdw; the same package the build installs brings
        # the runtime library.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdw-dev
      - uses: actions/download-artifact@v4
        with:
          name: cwsym-gcc
          path: bin/gcc/RelWithDebInfo
      # Artifacts do not keep permissions.
      - run: chmod +x bin/gcc/RelWithDebInfo/cwsym bin/gcc/RelWithDebInfo/crashme
      - run: npm run e2e
        working-directory: collector
        env:
          CW_BIN_DIR: ${{ github.workspace }}/bin/gcc/RelWithDebInfo
